<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWSDB - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand-inline"><span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C12 2 5 10.2 5 15a7 7 0 0 0 14 0C19 10.2 12 2 12 2z"/></svg></span><div><strong>NWSDB</strong><small>Water Bill Service</small></div></div>
        <nav>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h1>Create an account</h1>
            <p class="sub">Register to view and pay your water bill.</p>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="field">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" required autocomplete="username" placeholder="Choose a username">
                </div>

                <div class="field">
                    <label for="regPassword">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="regPassword" class="has-toggle" required minlength="4" autocomplete="new-password" placeholder="At least 4 characters">
                        <button type="button" class="toggle-pw" onclick="togglePassword('regPassword', this)" aria-label="Show or hide password">Show</button>
                    </div>
                </div>

                <div class="field">
                    <label id="roleLabel">Account type</label>
                    <div class="role-picker" role="radiogroup" aria-labelledby="roleLabel">
                        <input type="radio" name="regRole" id="roleCustomer" value="Customer" checked>
                        <label for="roleCustomer">Customer</label>
                        <input type="radio" name="regRole" id="roleStaff" value="Staff">
                        <label for="roleStaff">Staff</label>
                    </div>
                </div>

                <div class="field">
                    <label for="regAccountNumber">Account number</label>
                    <input type="text" id="regAccountNumber" required placeholder="e.g. NWS-1003">
                </div>

                <button type="submit" class="btn btn-primary">Create account</button>
            </form>

            <p class="switch">Already registered? <a href="login.html">Sign in</a></p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div>&copy; 2026 NWSDB &ndash; National Water Supply &amp; Drainage Board</div>
            <div class="footer-links">
                <span>Hotline: 1939</span>
                <span>info@nwsdb.example</span>
                <span>Mon&ndash;Fri, 8:30 am &ndash; 4:15 pm</span>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
