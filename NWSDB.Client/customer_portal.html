<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWSDB - Customer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-800">Customer Portal</h1>
                <p id="welcomeMessage" class="text-sm text-gray-600">Welcome! Loading account...</p>
            </div>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded text-sm font-semibold transition">
                Logout
            </button>
        </div>

        <div id="accountDetailsContainer" class="bg-slate-50 p-4 rounded-lg border border-slate-200">
            <p class="text-gray-500 text-center">Loading your account status...</p>
        </div>
    </div>

    <!-- JavaScript to Fetch Customer Specific Account Data Safely -->
    <script>
        const API_BASE_URL = "http://localhost:5067/api";

        async function fetchCustomerData() {
            try {
                const username = localStorage.getItem("username") || "customer1";
                document.getElementById("welcomeMessage").innerText = `Welcome, ${username}!`;

                const container = document.getElementById("accountDetailsContainer");
                const accountNumber = localStorage.getItem("accountNumber");

                if (!accountNumber) {
                    container.innerHTML = `<p class="text-red-500 text-center">No account number linked to your login. Please login again.</p>`;
                    return;
                }

                const response = await fetch(`${API_BASE_URL}/nwsdbservice/usage/${encodeURIComponent(accountNumber)}`);
                if (response.status === 404) {
                    container.innerHTML = `<p class="text-red-500 text-center">No account details found for ${accountNumber}.</p>`;
                    return;
                }
                if (!response.ok) throw new Error("Failed to fetch account data");

                const account = await response.json();

                const accountNoVal = account.accountNumber || "N/A";
                const customerNameVal = account.customerName || "N/A";
                const usageUnitsVal = account.currentUsageUnits ?? 0;
                const totalDueVal = account.totalDueAmount ?? 0;
                const statusVal = account.paymentStatus || "Unpaid";

                const statusClass = statusVal === "Paid" ? "text-green-600 font-bold" : "text-red-600 font-bold";
                const payButton = statusVal === "Paid" 
                    ? `<span class="text-green-600 font-semibold">Payment Completed</span>` 
                    : `<button onclick="payBill('${accountNoVal}')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold transition">Pay Bill Now</button>`;

                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between border-b pb-2">
                            <span class="font-medium text-gray-600">Account Number:</span>
                            <span class="font-bold text-gray-800">${accountNoVal}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="font-medium text-gray-600">Customer Name:</span>
                            <span class="font-semibold text-gray-800">${customerNameVal}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="font-medium text-gray-600">Usage Units:</span>
                            <span class="font-semibold text-gray-800">${usageUnitsVal} Units</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="font-medium text-gray-600">Total Due:</span>
                            <span class="font-semibold text-gray-800">Rs. ${Number(totalDueVal).toFixed(2)}</span>
                        </div>
                        <div class="flex justify-between border-b pb-2">
                            <span class="font-medium text-gray-600">Status:</span>
                            <span class="${statusClass}">${statusVal}</span>
                        </div>
                        <div class="pt-3 text-center">
                            ${payButton}
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error("Error loading customer portal:", error);
                document.getElementById("accountDetailsContainer").innerHTML = `<p class="text-red-500 text-center">Error connecting to server. Make sure backend is running!</p>`;
            }
        }

        function payBill(accountNo) {
            alert(`Payment gateway simulated successfully for Account: ${accountNo}`);
            location.reload();
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        window.addEventListener("DOMContentLoaded", () => {
            fetchCustomerData();
        });
    </script>
</body>
</html>
