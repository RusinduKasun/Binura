<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWSDB - Customer Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="customer">
    <header class="site-header">
        <div class="brand-inline"><span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C12 2 5 10.2 5 15a7 7 0 0 0 14 0C19 10.2 12 2 12 2z"/></svg></span><div><strong>NWSDB</strong><small>Water Bill Service</small></div></div>
        <div class="header-user">
            <span id="welcomeMessage">Loading...</span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title" style="text-align:center">My Water Bill</h1>
        <p class="page-sub" style="text-align:center">Your current bill and payment status.</p>

        <div class="bill-wrap" id="billContainer">
            <div class="center-msg"><div class="spinner"></div>Loading your bill...</div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div>&copy; 2026 NWSDB &ndash; National Water Supply &amp; Drainage Board</div>
            <div class="footer-links">
                <span>Hotline: 1939</span>
                <span>info@nwsdb.example</span>
                <span>Mon&ndash;Fri, 8:30 am &ndash; 4:15 pm</span>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
