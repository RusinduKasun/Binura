<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWSDB - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand-inline"><span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C12 2 5 10.2 5 15a7 7 0 0 0 14 0C19 10.2 12 2 12 2z"/></svg></span><div><strong>NWSDB</strong><small>Water Bill Service</small></div></div>
        <nav>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h1>Sign in</h1>
            <p class="sub">Access your NWSDB water bill account.</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autofocus autocomplete="username" placeholder="Enter your username">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" class="has-toggle" required autocomplete="current-password" placeholder="Enter your password">
                        <button type="button" class="toggle-pw" onclick="togglePassword('password', this)" aria-label="Show or hide password">Show</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>

            <p class="switch">New here? <a href="register.html">Create an account</a></p>
            <div class="hint">Demo accounts: <b>admin</b> / admin123 &nbsp;|&nbsp; <b>customer1</b> / 1234</div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div>&copy; 2026 NWSDB &ndash; National Water Supply &amp; Drainage Board</div>
            <div class="footer-links">
                <span>Hotline: 1939</span>
                <span>info@nwsdb.example</span>
                <span>Mon&ndash;Fri, 8:30 am &ndash; 4:15 pm</span>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
